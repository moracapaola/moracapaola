<!-- JS TOGGLE -->
<script>
const btn = document.querySelector(".sound-toggle");

btn.addEventListener("click", () => {
  btn.classList.toggle("off");

  if (btn.classList.contains("off")) {
    btn.textContent = "🔇 OFF";
  } else {
    btn.textContent = "🔊 ON";
  }
});
</script>
